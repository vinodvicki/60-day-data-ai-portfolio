# Dependabot — weekly pip updates for the portfolio.
# One entry per requirements file: the root dev requirements plus each
# day's requirements.txt (Dependabot takes one directory per entry).
# Added 2026-11-18 (best-practice retrofit). Updates arrive as pull
# requests; CI must stay green before merging — never merge a Dependabot
# PR that breaks a day's tests.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
