# Day 8 — Hospital Readmission Risk Model: lint/format config
# Minimal: ruff (lint) + black (format), both pinned in the portfolio-root
# requirements-dev.txt. Line length 88 matches black's default.

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

# Added 2026-11-18 (best-practice retrofit): coverage is measured over
# src/ (threshold enforced in CI); mypy is gradual for Days 1-12 —
# per-module ignores below cover code not yet typed. New days use the
# strict scaffold template instead (see agents/orchestrator.py).
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
